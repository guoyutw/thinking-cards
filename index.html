<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Thinking Cards</title>
<style>
  :root{
    --bg:#0b1117;
    --panel:#121a22;
    --panel2:#17212b;
    --text:#f3f7fa;
    --muted:#9aa8b5;
    --line:#263341;
    --accent:#9ee6bd;
    --accent2:#2f8f62;
    --danger:#ff8f8f;
    --shadow: 0 10px 30px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
  body{min-height:100vh}
  .app{max-width:980px;margin:0 auto;padding:20px 16px 96px}
  header{
    position:sticky;top:0;z-index:20;
    padding:14px 0 12px;
    background:linear-gradient(180deg,var(--bg) 78%,rgba(11,17,23,0));
    backdrop-filter: blur(10px);
  }
  .toprow{display:flex;gap:12px;align-items:center;justify-content:space-between}
  h1{font-size:28px;margin:0;letter-spacing:-.02em}
  .sub{margin:6px 0 0;color:var(--muted);font-size:14px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button,.filelabel{
    appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:13px;padding:10px 13px;font-weight:650;font-size:14px;cursor:pointer
  }
  button:hover,.filelabel:hover{border-color:#3d5368}
  .primary{background:var(--accent);color:#082016;border-color:transparent}
  .danger{color:var(--danger)}
  .searchwrap{display:flex;gap:10px;margin-top:16px}
  input[type="search"], input[type="text"], textarea, select{
    width:100%;border:1px solid var(--line);background:#0e151c;color:var(--text);
    border-radius:14px;padding:12px 13px;font:inherit;outline:none
  }
  textarea{min-height:210px;resize:vertical;line-height:1.55}
  input:focus,textarea:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(47,143,98,.16)}
  .chips{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border-radius:999px;padding:8px 12px;background:transparent;color:var(--muted)}
  .chip.active{background:#1b2b24;color:var(--accent);border-color:#355c48}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 10px;color:var(--muted);font-size:13px}
  .sections{display:flex;flex-direction:column;gap:28px}
  .grouphead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 2px 12px}
  .grouptitle{font-weight:800;font-size:18px}
  .grouptally{font-size:12px;color:var(--muted)}
  .grouphint{font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{
    background:linear-gradient(180deg,var(--panel),#101820);
    border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-height:220px
  }
  .cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .title{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .usage{color:#c5d0d8;font-size:14px;line-height:1.45;margin:10px 0 12px}
  .prompt{
    color:var(--muted);font-size:13px;line-height:1.55;
    white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden
  }
  .card.expanded .prompt{-webkit-line-clamp:unset;display:block}
  .cardfooter{margin-top:auto;padding-top:15px;display:flex;gap:8px;align-items:center}
  .copy{flex:1;background:var(--accent);color:#082016;border-color:transparent;font-size:15px}
  .ghost{background:transparent}
  .empty{padding:48px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
  .fab{
    position:fixed;right:20px;bottom:24px;width:58px;height:58px;border-radius:18px;
    display:grid;place-items:center;font-size:28px;background:var(--accent);color:#082016;
    border:none;box-shadow:0 12px 30px rgba(0,0,0,.35)
  }
  dialog{
    width:min(680px,calc(100vw - 24px));border:1px solid var(--line);border-radius:20px;
    background:var(--panel);color:var(--text);padding:0;box-shadow:var(--shadow)
  }
  dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(4px)}
  .modal{padding:18px}
  .modal h2{margin:0 0 16px}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{margin:10px 0}
  .field label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}
  .modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .toast{
    position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(12px);
    background:#e9fff3;color:#0a2b1d;padding:10px 14px;border-radius:999px;font-weight:750;
    opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow);z-index:50
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  @media (max-width:720px){
    .grid{grid-template-columns:1fr}
    h1{font-size:24px}
    .toprow{align-items:flex-start}
    .actions{justify-content:flex-end}
    .formgrid{grid-template-columns:1fr}
    .app{padding-left:12px;padding-right:12px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="toprow">
      <div>
        <h1>Thinking Cards</h1>
        <p class="sub">你的 Prompt 小工具箱：找卡片 → 複製 → 貼到 ChatGPT。</p>
      </div>
      <div class="actions">
        <label class="filelabel" for="importFile">匯入</label>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
        <button id="exportBtn">匯出</button>
      </div>
    </div>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="搜尋標題、用途或 Prompt…">
    </div>
    <div id="chips" class="chips"></div>
    <div class="meta">
      <span id="count"></span>
      <span>個人修改儲存在這台瀏覽器</span>
    </div>
  </header>

  <main id="grid" class="sections"></main>
</div>

<button id="addBtn" class="fab" aria-label="新增 Prompt">＋</button>

<dialog id="editor">
  <form method="dialog" class="modal" id="editorForm">
    <h2 id="editorTitle">新增 Prompt</h2>
    <input id="editId" type="hidden">
    <div class="formgrid">
      <div class="field">
        <label for="title">名稱</label>
        <input id="title" type="text" required placeholder="例如：證據檢查">
      </div>
      <div class="field">
        <label for="category">分類（建議從三大類選）</label>
        <input id="category" type="text" list="categoryOptions" placeholder="探索／檢查／推進">
        <datalist id="categoryOptions">
          <option value="探索"></option>
          <option value="檢查"></option>
          <option value="推進"></option>
        </datalist>
      </div>
    </div>
    <div class="field">
      <label for="usage">什麼時候用</label>
      <input id="usage" type="text" placeholder="一句話描述使用時機">
    </div>
    <div class="field">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" required placeholder="貼上完整提示詞"></textarea>
    </div>
    <div class="note">儲存後會留在這台瀏覽器的 localStorage。可用「匯出」備份成 JSON。</div>
    <div class="modalactions">
      <button value="cancel" type="button" id="cancelBtn">取消</button>
      <button class="primary" value="save" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast">已複製</div>

<script>
const STARTER = [
  {
    "id": "deep-question",
    "title": "更深的問題",
    "category": "探索",
    "usage": "想看看最近反覆討論的事情底下，是否其實繞著同一個更深問題。",
    "prompt": "根據你目前能取得的跨對話記憶與近期脈絡，在我最近反覆討論的問題背後，有沒有一個更深的問題，是我一直繞著它走，卻沒有真正問出來的？\n\n請區分：哪些是你真的從跨對話脈絡看到的重複證據，哪些只是你的推測。如果現有脈絡不足以支持一個共同母題，就直接說不足，不要為了給出漂亮答案而硬串。"
  },
  {
    "id": "fable-reframe",
    "title": "換框寓言",
    "category": "探索",
    "usage": "覺得自己卡在同一種觀看方式，想先拉開距離，再重新看問題。",
    "prompt": "先不要直接分析、解釋或給我解法。\n\n請根據我們現在正在談的問題，講一個表面情境完全不同、但核心結構相似的短寓言或小故事，讓我可以從旁邊重新看這件事。\n\n不要把原本的事件換皮重講，也不要先告訴我寓意。\n\n故事講完後，再用一個蘇格拉底式問題，問我從這個故事裡看到了什麼，陪我繼續往下想。"
  },
  {
    "id": "goal-align",
    "title": "目標對焦",
    "category": "檢查",
    "usage": "聊了一陣子、準備開始做之前，先確認真正目標與問題有沒有對準。",
    "prompt": "先不要急著執行。用你自己的話告訴我：你認為我真正想達成的目標是什麼、我現在真正想解決的問題是什麼。也請分清楚哪些是我的目標，哪些只是我目前想到的解法；如果你認為我其實問錯問題了，也直接指出來。\n\n請明確區分：哪些是我明確說過的、哪些是你根據對話推測的。"
  },
  {
    "id": "handoff",
    "title": "短 Handoff",
    "category": "推進",
    "usage": "這串要結束或準備換到另一個 ChatGPT 對話時，快速保住目前狀態。",
    "prompt": "請給我一份很短的 handoff，讓我貼到另一個 ChatGPT 對話繼續討論。\n\n只保留：\n現在在做什麼／目標\n目前做到哪裡\n已經確定的重要決策\n現在卡在哪裡或正在等什麼\n下一個對話最需要知道的一件事\n\n不要重述完整歷史，不要重新分析，不要延伸新方案。不要把仍在驗證的假說寫成已確定決策。控制在能快速讀完的長度。"
  },
  {
    "id": "loop-diagnosis",
    "title": "迴圈診斷",
    "category": "檢查",
    "usage": "同一件工作反覆修改、測試或 Review，想判斷是有效收斂，還是方法需要調整時。",
    "prompt": "# 迴圈診斷（Loop Diagnosis）｜v0.3\n\n我發現目前這件工作反覆經歷「提出方案 → 執行或修改 → 驗證或 Review → 發現問題 → 再修改」的循環。\n\n請針對整個工作歷程進行一次**以證據為基礎的方法診斷**，判斷我們是在有效收斂、正常探索，還是陷入需要改變方法的循環。\n\n本輪的任務是診斷，而不是修復。可以讀取證據、分析與提出建議，但不修改檔案、程式、規格或部署，也不自行啟動新的實作或 Review。既有授權、凍結需求與審查關卡仍然有效。\n\n## 第一步：確認目標與證據範圍\n\n先確認：\n- 這件工作的原始目標與成功條件是什麼？\n- 目前採用什麼解決方法？\n- 已經發生哪些主要修改與驗證循環？\n- 哪些原始紀錄可以實際取得？\n\n優先使用適用的權威資料，例如原始需求、規格版本、修改紀錄、測試結果、Review 原文及執行證據。\n\n每項關鍵事實應標明可追溯的來源或定位。區分親自取得的原始證據、使用者提供的轉述及推論，不得把轉述當成獨立驗證。\n\n如果無法取得完整歷史，明確指出覆蓋範圍和缺少的證據，繼續做有邊界的診斷。\n\n完成條件：能清楚說明目前掌握了哪些事實、缺少哪些資料，以及哪些結論因此受到限制。\n\n## 第二步：重建循環\n\n依時間順序整理重要的修改與驗證輪次。\n\n對每一輪，盡可能確認：\n- 當時要解決什麼問題？\n- 實際改變了什麼？\n- 用什麼方法驗證？\n- 驗證或 Review 發現了什麼？\n- 原本的問題是否已被證明修復？\n- 與前一輪相比，哪些事情真正改善或退步？\n\n將發現的問題分類：\n\n1. 同一個根因持續存在或再次出現。\n2. 舊問題已解決，但暴露其他獨立問題。\n3. 修正引入了新的問題。\n4. 需求、驗收標準或 Review 範圍發生改變。\n5. 缺少足夠證據，無法判定修正是否有效。\n\n相似的錯誤表現不必然有相同根因；不同的錯誤表現也可能來自共同機制。分類必須有支持證據。\n\n完成條件：能說明循環如何形成，並區分已證實的進步、重複失敗與尚無法判斷的部分。\n\n## 第三步：建立競爭性解釋\n\n根據前面的事實，提出最有解釋力的幾個假說。\n\n至少考慮兩個方向：\n\n**假說 A：目前正在正常收斂。**\n\n每輪修正可能真的解決了不同問題；新的 Review 失敗並不代表先前的工作無效。\n\n**假說 B：目前的方法存在系統性缺陷。**\n\n可能是目標、核心假設、設計、工作分工、實作方式、驗證方法或 Review 機制，使相同類型的失敗持續發生。\n\n也可以提出其他更符合證據的假說，例如需求不穩定、審查標準漂移、執行環境不一致，或上下文交接造成資訊遺失。\n\n對每個重要假說，說明：\n\n- 哪些具體證據支持？\n- 哪些證據反對？\n- 哪些失敗是它無法解釋的？\n- 目前的信心程度為何？\n- 還需要什麼證據才能區分它與其他假說？\n\n請區分問題所處的層次，不要把所有缺陷都歸因於架構，也不要把流程問題一律視為程式 Bug。\n\n完成條件：至少存在兩個經過證據比較的競爭性解釋，或明確說明為什麼現有資料不足以形成有效比較。\n\n## 第四步：挑戰自己的診斷\n\n在推薦任何改變之前，對目前最有信心的解釋進行反證檢查。\n\n請回答：\n\n1. 有沒有其他原因，也能解釋相同的失敗紀錄？\n2. 我的診斷是否受到之前討論過的技術、架構或偏好影響，而不完全來自這次取得的證據？\n3. 如果目前方法繼續使用，什麼結果會支持「其實正在正常收斂」？\n4. 如果改採新方法，哪些已知問題仍然可能發生？可能引入哪些新成本、依賴或失敗模式？\n5. 是否有較小的流程修正或驗證改進，就能解決問題，而不需要大幅重新設計？\n\n從原始目標出發比較方法，不受既有投入或目前方案限制，但也不因為反覆失敗就預設必須換方向。\n\n完成條件：最終判斷已經考慮替代解釋、反面證據，以及推薦方案自身的限制。\n\n## 第五步：判斷下一步\n\n根據證據，在以下方向中選擇最有根據的一項：\n\n- **繼續現有方法**：證據顯示正在有效收斂。\n- **調整執行或驗證流程**：主要問題來自工作方法，而非核心設計。\n- **改變設計或解決路徑**：現有機制存在有證據支持的結構性限制。\n- **縮小範圍進行實驗**：先驗證最關鍵、最不確定的部分。\n- **暫不決定方向**：目前證據不足，應先取得能區分假說的資訊。\n\n說明所選方向的依據、主要風險，以及不選其他方向的理由。\n\n**新增工作必要性檢查**\n\n在提出新的實驗、審查或設計診斷前，先確認既有工作流程、待執行的驗證或已取得的證據，是否足以區分目前的競爭性假說。\n\n若建議新增工作，必須說明它比既有方法多提供什麼關鍵證據、需要付出什麼成本，以及為什麼值得優先執行。\n\n避免讓診斷本身成為另一個不斷增加工作、卻沒有推動原始目標的循環。\n\n最後提出**唯一一個最有判別力的下一步**，包括：\n\n- 要驗證哪個關鍵假說？\n- 最小需要執行什麼？\n- 觀察什麼結果才算支持或反駁假說？\n- 不同結果將如何改變後續決策？\n\n這個下一步可以是補充證據、設計實驗或提出修改建議，不代表本輪已取得執行授權。\n\n## 輸出格式\n\n依序提供：\n\n1. **核心診斷**：一句話說明目前最有根據的判斷與信心程度。\n2. **循環重建**：重要輪次、已證實的進步、反覆失敗，以及可追溯的證據。\n3. **競爭性假說**：支持與反對證據、替代解釋及尚未解決的疑問。\n4. **方法評估**：目前方法的有效部分、可能失效的機制、替代做法的收益與代價。\n5. **決策與下一步**：目前建議、最大風險、最小判別行動，以及不同結果對決策的影響。\n\n以證據決定結論的強度。證據不足時，可以明確判定為「尚無法確認」，而不必勉強找到深層原因或提出新的架構。\n\n最終目標不是產生更好的修補建議，而是判斷：\n\n**我們是在透過每一次循環逼近成功，還是需要改變讓這些循環持續發生的方法？**"
  },
  {
    "id": "evidence-check",
    "title": "證據檢查",
    "category": "檢查",
    "usage": "AI 的解釋太漂亮、太有共鳴，擔心它把推論或腦補當成事實時。",
    "prompt": "請 review 你剛才的回答。\n\n把重要內容分成三類：\n\n1. 我在這段對話中明確提供的事實\n2. 你根據這些事實做出的合理推論\n3. 目前證據不足的猜測\n\n如果你把推論講成事實，或補了我沒有說過的經歷、動機、感受，請直接指出並修正。\n\n不要因為某個解釋很漂亮、很有共鳴，就提高它的可信度。"
  },
  {
    "id": "ai-collaboration-calibration",
    "title": "AI 合作校準",

    "prompt": "# Lulumi Mission Control｜五角色即時查證 Dashboard v0.2\n\n請**直接產生這次查詢時點的 Lulumi Mission Control 五角色 Dashboard**。不是研究「可不可以做 Dashboard」、不是開發網頁，也不是跨專案知識地圖。先查能取得的原始資料，**第一屏就交付精簡視覺化 Dashboard**；缺資料也照常顯示，不要先寫長篇查證報告、研究計畫或反覆徵求開工核准。\n\n## 監控對象與資料\n五位：ChatGPT :00 大總管、:20 成員、:40 成員、Hermes 偷米、Grok Scout。\n- 先按現有合法工具取最新、可追溯證據：ChatGPT 原生 Automations 的三個 Task／自然 Run 終態與結果；`guoyutw/lulumi-steward` 的 README → AGENTS → NOW（只看 CURRENT）及相關原始 Issue／PR／Run 檔；Quest Log HUD Projection 的進度和來源更新時間；Hermes 原 Task／Session／Cron；Grok Scout 原生報告或 GitHub 研究分支。\n- 只查對本次畫面有用的最新紀錄與近七日成果，避免重掃完整歷史。所有時間註明 Asia/Taipei、觀察時間與資料新鮮度。對外部專案事實依各自最新權威來源。\n- 每一項重大結論都標示來源連結或可定位的 Task／Run ID；親自讀回、Agent 自述、Owner 轉貼、推論要分開。查不到就標 `UNKNOWN／未接入`，不要補猜。\n- Grok 的 NOOP 可能只在原生聊天、沒有 GitHub 檔案；**沒有檔案不等於 NOOP、失敗或未執行**。Hermes 的歷史 Issue／GitHub 留言也不能當作最新原生 Session 終態。\n\n## 直接輸出 Dashboard（首屏，目標一分鐘看完）\n**1｜總覽：** 以少量關鍵摘要顯示「最新原生 Run 可驗證覆蓋數／5」、「近七天有證據且去重的可用成果／接續鏈」、「真正需要 Owner 現在處理的 Gate 數」。這些數字是觀察覆蓋與成果，不是 Agent 績效分數；證據不足就寫未知，不能硬湊。\n**2｜五角色狀態：** 用一張精簡表或卡片，逐位顯示「最後可證實時間／任務、原生終態或 UNKNOWN、最近做了什麼、是否有新成果、來源及新鮮度」。把最近一次 `NO_CHANGE／NOOP` 與近七天貢獻分開，不能抹除先前成果。\n**3｜近期真正有用的成果：** 最多 3–5 個，按對 Owner 的可驗證用途排序；每項一句寫明「產物或決策改善、驗證／採用狀態、未證明的效益」，一項成果只計一次。\n**4｜跨角色接續與 Owner Gates：** 用最短方式呈現誰提出／修正／非作者驗證／下一輪採納，以及是否帶來實際改善。Owner Gates 僅列出「現在確實需要 Owner 決定才能繼續」的事項；非緊急候選與一般工作阻礙另標「待後續」，不要製造新的核准負擔。\n\n## 詳細依據（放在首屏之後）\n必要時附可點開的原始 Issue／Run／Commit／HUD 來源、查核時間與資料缺口；不要把整份研究報告塞回首頁。當前原生執行狀態和跨專案 Quest Log 人工快照是不同時間尺度，清楚標示，不得混作即時狀態。原生執行的 `completed`、原通道 delivery、持久化、獨立 Review、Consume、Owner 實際採用是不同事件，不得跳級宣稱。\n\n## 評估與停止規則\n採用 Steward 的 Owner Value First：最重要是實際改善 Owner 的工作、生活、決策、能力或經濟利益；另外觀察是否減少 Owner 指派／傳話／追蹤負擔，以及多 Agent 協作是否值得成本。醒來次數、研究量、Review 數、NOOP 數均不是價值代理指標；沒有節省時間或收入的證據就不要估算。\n\n直接呈現這次可用的 Dashboard；**不要因 Grok／Hermes 欄位不完整就停止輸出或要求先修資料管線**。畫面後最多給「主要可信度缺口、一件最值得注意的事、一個必要的後續行動」；若現有畫面已足夠就不用提新工作。\n\n本卡只授權唯讀查證與在本次對話呈現快照，不授權修改 Repo／Issue／Prompt／Automations／Routine／權限／資料保存方式，也不授權派工、部署、增設監控後端或打斷既有自然試行。"

          localStorage.setItem(STATE_DELTA_MIGRATION_KEY,"1");
        }
        return saved;
      }
    }
  }catch(e){}
  localStorage.setItem(KEY, JSON.stringify(STARTER));
  localStorage.setItem(GROUP_MIGRATION_KEY, "1");
  localStorage.setItem(GLOBAL_RESEARCH_MIGRATION_KEY, "1");
  localStorage.setItem(AI_COLLAB_MIGRATION_KEY, "1");
  localStorage.setItem(MISSION_CONTROL_MIGRATION_KEY, "1");
  localStorage.setItem(MISSION_CONTROL_V02_MIGRATION_KEY, "1");
  localStorage.setItem(STATE_DELTA_MIGRATION_KEY, "1");
  return structuredClone(STARTER);
}
function save(){ localStorage.setItem(KEY, JSON.stringify(cards)); }

function safeCount(n){
  return Number.isSafeInteger(n) && n >= 0 ? n : 0;
}
function normalizeCopyStats(raw){
  const result=Object.create(null);
  if(!raw || typeof raw!=="object" || Array.isArray(raw)) return result;
  for(const [id,value] of Object.entries(raw)){
    if(!id || typeof value!=="object" || !value || Array.isArray(value)) continue;
    const days=Object.create(null);
    if(value.days && typeof value.days==="object" && !Array.isArray(value.days)){
      for(const [day,count] of Object.entries(value.days)){
        if(/^\\d{4}-\\d{2}-\\d{2}$/.test(day) && safeCount(count)>0) days[day]=count;
      }
    }
    const lastCopiedAt=typeof value.lastCopiedAt==="string" && Number.isFinite(Date.parse(value.lastCopiedAt)) ? value.lastCopiedAt : null;
    result[id]={total:safeCount(value.total),days,lastCopiedAt};
  }
  return result;
}
function loadCopyStats(){
  try{return normalizeCopyStats(JSON.parse(localStorage.getItem(COPY_STATS_KEY)||"{}"));}
  catch{return Object.create(null);}
}
function saveCopyStats(next){
  try{
    localStorage.setItem(COPY_STATS_KEY,JSON.stringify(next));
    copyStats=next;
    return true;
  }catch{return false;}
}
function localDay(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function last30Days(){
  const today=new Date();
  today.setHours(12,0,0,0);
  const keys=new Set();
  for(let i=0;i<30;i++){
    const day=new Date(today);
    day.setDate(today.getDate()-i);
    keys.add(localDay(day));
  }
  return keys;
}
function statTotal(id){return safeCount(copyStats[id]?.total);}
function stat30(id,keys){
  return Object.entries(copyStats[id]?.days||{}).reduce((sum,[day,count])=>sum+(keys.has(day)?safeCount(count):0),0);
}
function lastCopied(id){
  const raw=copyStats[id]?.lastCopiedAt;
  if(!raw) return "尚無紀錄";
  const d=new Date(raw);
  return Number.isFinite(d.getTime()) ? d.toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "尚無紀錄";
}
function compareCards(a,b,keys){
  if(sortMode==="30d"){
    const diff=stat30(b.id,keys)-stat30(a.id,keys);
    if(diff) return diff;
  }else if(sortMode==="total"){
    const diff=statTotal(b.id)-statTotal(a.id);
    if(diff) return diff;
  }else if(sortMode==="last"){
    const at=Date.parse(copyStats[a.id]?.lastCopiedAt||"")||0;
    const bt=Date.parse(copyStats[b.id]?.lastCopiedAt||"")||0;
    if(at!==bt) return bt-at;
  }
  const ai=DISPLAY_ORDER.indexOf(a.id),bi=DISPLAY_ORDER.indexOf(b.id);
  return (ai<0?Infinity:ai)-(bi<0?Infinity:bi)||0;
}
function recordCopy(id){
  const now=new Date(),day=localDay(now);
  const previous=copyStats[id]||{total:0,days:Object.create(null),lastCopiedAt:null};
  const nextDays={...previous.days,[day]:safeCount(previous.days?.[day])+1};
  const next={...copyStats,[id]:{total:safeCount(previous.total)+1,days:nextDays,lastCopiedAt:now.toISOString()}};
  return saveCopyStats(next);
}
function mergeCopyStats(current,incoming){
  const merged=normalizeCopyStats(current);
  for(const [id,other] of Object.entries(normalizeCopyStats(incoming))){
    const existing=merged[id];
    if(!existing){merged[id]=other;continue;}
    const days={...existing.days};
    for(const [day,n] of Object.entries(other.days)) days[day]=Math.max(safeCount(days[day]),n);
    const recent=[existing.lastCopiedAt,other.lastCopiedAt].filter(Boolean).sort().at(-1)||null;
    const sumDays=Object.values(days).reduce((sum,n)=>sum+n,0);
    // Avoid double-counting overlapping histories when importing a backup twice.
    merged[id]={total:Math.max(existing.total,other.total,sumDays),days,lastCopiedAt:recent};
  }
  return merged;
}

function esc(s=""){ return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m])); }
function toast(msg="已複製"){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1500);
}
async function copyText(id,text){
  let copied=false;
  try{
    if(!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");
    await navigator.clipboard.writeText(text);
    copied=true;
  }catch{
    let ta;
    try{
      ta=document.createElement("textarea");
      ta.value=text;
      document.body.appendChild(ta);
      ta.select();
      copied=document.execCommand("copy")===true;
    }catch{copied=false;}
    finally{ta?.remove();}
  }
  if(!copied){toast("複製失敗，請再試一次");return false;}
  if(!recordCopy(id)){toast("已複製，但無法儲存次數");return true;}
  toast("已複製 Prompt");
  render();
  return true;
}
function categories(){
  const found=[...new Set(cards.map(c=>c.category||"未分類"))];
  const standard=CATEGORY_GROUPS.map(x=>x.name).filter(c=>found.includes(c));
  const custom=found.filter(c=>!standard.includes(c)).sort();
  return ["全部",...standard,...custom];
}
function renderChips(){
  const box=document.getElementById("chips");
  box.innerHTML=categories().map(c=>{
    const count=c==="全部"?cards.length:cards.filter(item=>(item.category||"未分類")===c).length;
    return `<button class="chip ${c===category?"active":""}" data-cat="${esc(c)}">${esc(c)} · ${count}</button>`;
  }).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{category=b.dataset.cat; render();});
}
function filtered(){
  const q=query.trim().toLowerCase();
  return cards.filter(c=>{
    const catOk=category==="全部" || (c.category||"未分類")===category;
    const text=(c.title+" "+c.usage+" "+c.prompt+" "+c.category).toLowerCase();
    return catOk && (!q || text.includes(q));
  });
}
function render(){
  if(category!=="全部"&&!categories().includes(category)) category="全部";
  renderChips();
  const list=filtered();
  document.getElementById("count").textContent=`${list.length} 張卡片`;
  const container=document.getElementById("grid");
  if(!list.length){ container.innerHTML=`<div class="empty">沒有符合的卡片。</div>`; return; }
  container.innerHTML=categories().filter(c=>c!=="全部"&&(category==="全部"||c===category)).map(cat=>{
    const items=list.filter(c=>(c.category||"未分類")===cat).sort((a,b)=>{
      const ai=DISPLAY_ORDER.indexOf(a.id),bi=DISPLAY_ORDER.indexOf(b.id);
      return (ai<0?Infinity:ai)-(bi<0?Infinity:bi)||0;
    });
    if(!items.length) return "";
    const hint=CATEGORY_GROUPS.find(x=>x.name===cat)?.hint||"自訂分類";
    return `
      <section class="group" aria-label="${esc(cat)}">
        <div class="grouphead">
          <span class="grouptitle">${esc(cat)}</span>
          <span class="grouptally">${items.length} 張</span>
          <span class="grouphint">${esc(hint)}</span>
        </div>
        <div class="grid">${items.map(c=>`
          <article class="card" data-id="${esc(c.id)}">
            <div class="cardtop"><div class="title">${esc(c.title)}</div></div>
            <div class="usage">${esc(c.usage||"")}</div>
            <div class="prompt">${esc(c.prompt)}</div>
            <div class="cardfooter">
              <button class="copy" data-act="copy">複製</button>
              <button class="ghost" data-act="expand">展開</button>
              <button class="ghost" data-act="edit">編輯</button>
            </div>
          </article>
        `).join("")}</div>
      </section>`;
  }).join("");

  container.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id, item=cards.find(x=>x.id===id);
    card.querySelector('[data-act="copy"]').onclick=()=>copyText(item.prompt);
    card.querySelector('[data-act="expand"]').onclick=(e)=>{
      card.classList.toggle("expanded");
      e.currentTarget.textContent=card.classList.contains("expanded")?"收合":"展開";
    };
    card.querySelector('[data-act="edit"]').onclick=()=>openEditor(item);
  });
}

const editor=document.getElementById("editor");
const form=document.getElementById("editorForm");
function openEditor(item=null){
  document.getElementById("editorTitle").textContent=item?"編輯 Prompt":"新增 Prompt";
  document.getElementById("editId").value=item?.id||"";
  document.getElementById("title").value=item?.title||"";
  document.getElementById("category").value=item?.category||"";
  document.getElementById("usage").value=item?.usage||"";
  document.getElementById("prompt").value=item?.prompt||"";
  editor.showModal();
}
document.getElementById("addBtn").onclick=()=>openEditor();
document.getElementById("cancelBtn").onclick=()=>editor.close();

form.onsubmit=(e)=>{
  e.preventDefault();
  const id=document.getElementById("editId").value;
  const item={
    id:id||uid(),
    title:document.getElementById("title").value.trim(),
    category:document.getElementById("category").value.trim()||"未分類",
    usage:document.getElementById("usage").value.trim(),
    prompt:document.getElementById("prompt").value.trim()
  };
  if(!item.title || !item.prompt) return;
  const idx=cards.findIndex(x=>x.id===item.id);
  if(idx>=0) cards[idx]=item; else cards.unshift(item);
  save(); editor.close(); render(); toast(idx>=0?"已更新":"已新增");
};

document.getElementById("search").oninput=e=>{ query=e.target.value; render(); };

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="thinking-cards-prompts.json"; a.click(); URL.revokeObjectURL(a.href);
};

document.getElementById("importFile").onchange=async e=>{
  const file=e.target.files?.[0]; if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data)) throw new Error("JSON 必須是陣列");
    const cleaned=data.map((x,i)=>({
      id:x.id||uid()+"_"+i,
      title:String(x.title||"未命名"),
      category:String(x.category||"未分類"),
      usage:String(x.usage||""),
      prompt:String(x.prompt||"")
    })).filter(x=>x.prompt);
    // Old exported starter cards should follow the current grouping after import.
    for(const item of cleaned){
      const starter=STARTER.find(c=>c.id===item.id);
      if(starter && item.category===LEGACY_CATEGORIES[item.id]) item.category=starter.category;
    }
    const replace=confirm(`找到 ${cleaned.length} 張卡片。\n\n按「確定」＝取代目前全部卡片\n按「取消」＝合併進目前卡片`);
    if(replace) cards=cleaned;
    else{
      const byId=new Map(cards.map(x=>[x.id,x]));
      cleaned.forEach(x=>byId.set(x.id,x));
      cards=[...byId.values()];
    }
    save(); render(); toast("匯入完成");
  }catch(err){ alert("匯入失敗：" + err.message); }
  e.target.value="";
};

// Long-press / contextual delete intentionally omitted from UI.
// Delete is available from edit mode with keyboard shortcut? Add explicit dblclick fallback.
editor.addEventListener("keydown", e=>{
  if(e.key==="Delete" && e.ctrlKey){
    const id=document.getElementById("editId").value;
    if(id && confirm("刪除這張卡片？")){
      cards=cards.filter(x=>x.id!==id); save(); editor.close(); render(); toast("已刪除");
    }
  }
});

render();
</script>
</body>
